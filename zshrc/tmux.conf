# Enable system clipboard integration
set -g set-clipboard on

# Force tmux to use pbcopy/pbpaste on macOS
if-shell "uname | grep -q Darwin" \
  "bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-clear 'pbcopy'; \
   bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-clear 'pbcopy'"

# Plugin list
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Optional: restore pane contents
set -g @resurrect-capture-pane-contents 'on'

# Initialize TPM (must stay at the very end)
run '~/.tmux/plugins/tpm/tpm'
